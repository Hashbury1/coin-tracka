# DO NOT fill this in and `kubectl apply -f` it - that would commit secrets
# to git the same way a filled-in .env would. This file exists purely to
# document which keys the Secret must contain.
#
# Instead, create the real Secret directly from your existing .env,
# which never touches a file that could get committed:
#
#   kubectl create secret generic app-secrets \
#     --namespace coin-tracka \
#     --from-literal=POSTGRES_USER=meme_admin \
#     --from-literal=POSTGRES_PASSWORD=<your real password> \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://meme_admin:<password>@timescaledb:5432/meme_tracker" \
#     --from-literal=BIRDEYE_API_KEY=<your key> \
#     --from-literal=MORALIS_API_KEY=<your key> \
#     --from-literal=TWITTER_BEARER_TOKEN=<your token> \
#     --from-literal=COINGECKO_API_KEY=<your key or blank> \
#     --from-literal=GRAFANA_ADMIN_PASSWORD=<pick one>
#
# Or, since you already have a working .env file, generate the command
# from it directly rather than retyping every value:
#
#   kubectl create namespace coin-tracka --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic app-secrets --namespace coin-tracka \
#     $(grep -v '^#' .env | grep -v '^$' | sed 's/^/--from-literal=/' | tr '\n' ' ')
#
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: coin-tracka
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@timescaledb:5432/meme_tracker"
  BIRDEYE_API_KEY: "CHANGE_ME"
  MORALIS_API_KEY: "CHANGE_ME"
  TWITTER_BEARER_TOKEN: "CHANGE_ME"
  COINGECKO_API_KEY: ""
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"
