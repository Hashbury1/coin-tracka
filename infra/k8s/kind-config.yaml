# kind cluster config for running the full stack locally, production-topology
# style: real Deployments/Services/Ingress instead of docker-compose.
#
# Usage: kind create cluster --config infra/k8s/kind-config.yaml --name coin-tracka
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # NOTE: this maps host 80/443 -> fixed NodePorts (30080/30443) on the
      # node, NOT to a pod's hostPort. containerPort here is Docker-level
      # port publishing on the kind node container - handled by dockerd's
      # own networking, completely separate from Kubernetes' CNI portmap
      # plugin. We deliberately avoid pod-level hostPort (the standard
      # ingress-nginx kind pattern) because it requires iptables extensions
      # (comment, MARK) that may not exist on every host kernel - routing
      # through a NodePort Service instead uses kube-proxy's iptables
      # rules, a different code path that doesn't hit the same issue.
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
    extraMounts:
      # Mirrors docker-compose's `./frontend:/usr/share/nginx/html:ro` bind
      # mount. Edit the host path on the left if your repo isn't at
      # ~/coin-tracka - kind needs an absolute path here.
      - hostPath: /home/hashbury/coin-tracka/frontend
        containerPath: /mnt/frontend
        readOnly: true