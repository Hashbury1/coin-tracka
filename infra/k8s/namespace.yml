apiVersion: v1
kind: Namespace
metadata:
  name: coin-tracka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: coin-tracka
data:
  # ---- shared ----
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_STREAM_NAME: "raw_ticks"
  MIN_LIQUIDITY_USD: "20000"

  # ---- ingestion ----
  DEXSCREENER_BASE_URL: "https://api.dexscreener.com/latest"
  POLL_INTERVAL_SECONDS: "30"
  TRACKED_CHAINS: "solana,bsc"
  ENRICHMENT_LIMIT: "15"

  # ---- scoring ----
  SCORING_INTERVAL_SECONDS: "30"
  SCORING_WINDOW_MINUTES: "60"
  WEIGHT_VOLATILITY: "0.3"
  WEIGHT_MOMENTUM: "0.3"
  WEIGHT_LIQUIDITY: "0.2"
  WEIGHT_HOLDER_SAFETY: "0.2"
  WEIGHT_SOCIAL: "0.0"

  # ---- database (host/port/name only - credentials live in the Secret) ----
  POSTGRES_HOST: "timescaledb"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "meme_tracker"