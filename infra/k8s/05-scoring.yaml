apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  namespace: coin-tracka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scoring
  template:
    metadata:
      labels:
        app: scoring
    spec:
      initContainers:
        # docker-compose expressed this as depends_on: condition:
        # service_healthy - Kubernetes has no equivalent wait-for-dependency
        # primitive, so an initContainer polling is the standard substitute.
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping; do
                echo "waiting for redis..."; sleep 2;
              done
        - name: wait-for-timescaledb
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h timescaledb -p 5432; do
                echo "waiting for timescaledb..."; sleep 2;
              done
      containers:
        - name: scoring
          image: coin-tracka-scoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: scoring
  namespace: coin-tracka
  labels:
    app: scoring
spec:
  selector:
    app: scoring
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
