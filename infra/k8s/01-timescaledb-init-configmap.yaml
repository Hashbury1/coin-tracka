apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
  namespace: coin-tracka
data:
  init.sql: |
    -- Enable TimescaleDB extension
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    
    -- Master token registry
    CREATE TABLE IF NOT EXISTS tokens (
        token_id        TEXT PRIMARY KEY,      -- e.g. "solana:dexpairaddress" or coingecko id
        symbol          TEXT NOT NULL,
        name            TEXT NOT NULL,
        chain           TEXT NOT NULL,
        source          TEXT NOT NULL,          -- 'coingecko' | 'dexscreener'
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    
    -- Raw price/volume ticks (append-only, high write volume)
    CREATE TABLE IF NOT EXISTS ticks (
        time                    TIMESTAMPTZ NOT NULL,
        token_id                TEXT NOT NULL REFERENCES tokens(token_id),
        price_usd               DOUBLE PRECISION NOT NULL,
        volume_24h_usd          DOUBLE PRECISION,
        liquidity_usd           DOUBLE PRECISION,
        market_cap_usd          DOUBLE PRECISION,
        -- Enrichment fields â nullable, only populated for the top N tokens
        -- by liquidity each cycle (see services/ingestion/main.py::enrich_tick),
        -- since these come from separate, rate-limited per-token API calls.
        holder_count            INTEGER,
        top10_concentration_pct DOUBLE PRECISION,  -- % of supply held by top 10 wallets
        social_mentions_1h      INTEGER,
        PRIMARY KEY (time, token_id)
    );
    
    SELECT create_hypertable('ticks', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_ticks_token_time ON ticks (token_id, time DESC);
    
    -- Computed scores, one row per token per scoring run
    CREATE TABLE IF NOT EXISTS scores (
        time                TIMESTAMPTZ NOT NULL,
        token_id            TEXT NOT NULL REFERENCES tokens(token_id),
        volatility_score    DOUBLE PRECISION NOT NULL,
        momentum_score      DOUBLE PRECISION NOT NULL,
        liquidity_score     DOUBLE PRECISION NOT NULL,
        holder_safety_score DOUBLE PRECISION,  -- nullable: only computed when holder data was available
        social_score        DOUBLE PRECISION,  -- nullable: only computed when social data was available
        composite_score     DOUBLE PRECISION NOT NULL,
        window_label        TEXT NOT NULL,      -- '5m' | '1h' | '24h'
        PRIMARY KEY (time, token_id, window_label)
    );
    
    SELECT create_hypertable('scores', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_scores_composite ON scores (window_label, time DESC, composite_score DESC);
    
    -- Retention: keep raw ticks 30 days, scores 90 days (tune for production)
    SELECT add_retention_policy('ticks', INTERVAL '30 days', if_not_exists => TRUE);
    SELECT add_retention_policy('scores', INTERVAL '90 days', if_not_exists => TRUE);
    ENDOFFILE

cat > infra/k8s/02-timescaledb.yaml << 'ENDOFFILE'
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: coin-tracka
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: app-secrets # provides POSTGRES_USER / POSTGRES_PASSWORD
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: init-sql
          configMap:
            name: timescaledb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: coin-tracka
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None # headless - StatefulSets get stable DNS (timescaledb-0.timescaledb) without needing one
