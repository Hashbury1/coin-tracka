apiVersion: v1
kind: ConfigMap
metadata:
  name: meme-tracker-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  meme-tracker-overview.json: |
    {
      "title": "Meme Coin Tracker — System Health",
      "uid": "meme-tracker-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Ticks Pushed / sec (Ingestion)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(ingestion_ticks_pushed_total[5m])",
              "legendFormat": "ticks/sec"
            }
          ]
        },
        {
          "id": 2,
          "title": "Fetch Errors by Source",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "rate(ingestion_fetch_errors_total[5m])",
              "legendFormat": "{{ source }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Tokens Scored / sec",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "rate(scoring_tokens_scored_total[5m])",
              "legendFormat": "tokens/sec"
            }
          ]
        },
        {
          "id": 4,
          "title": "Scoring Cycle Duration (p95)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(scoring_cycle_duration_seconds_bucket[5m]))",
              "legendFormat": "p95 duration (s)"
            }
          ]
        },
        {
          "id": 5,
          "title": "Seconds Since Last Successful Scoring Cycle",
          "type": "timeseries",
          "datasource": "Prometheus",
          "description": "If this climbs steadily instead of sawtoothing back down, scoring has stalled - see ScoringStalled alert.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "time() - scoring_last_successful_cycle_timestamp_seconds",
              "legendFormat": "seconds since last cycle"
            }
          ]
        },
        {
          "id": 6,
          "title": "DB Connection Retries",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "increase(scoring_db_connect_retries_total[10m])",
              "legendFormat": "retries (10m)"
            }
          ]
        },
        {
          "id": 7,
          "title": "API Request Rate by Status Code",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total[5m]))",
              "legendFormat": "{{ status }}"
            }
          ]
        },
        {
          "id": 8,
          "title": "API Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 9,
          "title": "Rate Limit Rejections",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "increase(api_rate_limit_exceeded_total[10m])",
              "legendFormat": "rejections (10m)"
            }
          ]
        },
        {
          "id": 10,
          "title": "Service Uptime",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "up",
              "legendFormat": "{{ job }}"
            }
          ]
        }
      ]
    }
    