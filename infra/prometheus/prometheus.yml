global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:9101"]

  - job_name: "scoring"
    static_configs:
      - targets: ["scoring:9102"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]