name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------- Lint & unit tests (every PR and push) ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run unit tests with coverage
        run: pytest tests/ --cov=services --cov-report=term-missing --cov-fail-under=70

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check services/ --output-format=github

  # ---------- Dependency vulnerability scan ----------
  dependency-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  # ---------- Build & scan container images ----------
  build:
    runs-on: ubuntu-latest
    needs: [test, dependency-scan]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [ingestion, scoring, api]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }} \
            ./services/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Push image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  # ---------- Deploy to staging (auto on develop branch) ----------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging cluster
        run: echo "kubectl apply / terraform apply against staging workspace goes here"

  # ---------- Deploy to production (manual approval gate on main) ----------
  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production  # configure required reviewers on this environment in repo settings
    steps:
      - name: Deploy to production cluster
        run: echo "kubectl apply / terraform apply against production workspace goes here"
